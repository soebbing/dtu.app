# Production-style, "docker compose up" deployment.
#
# - TimescaleDB runs as its own container (the only DB the app supports).
# - The app image is the Elixir release from ./Dockerfile. Its entrypoint runs
#   Ecto migrations on every start, then boots the release serving HTTP on 4000
#   and the embedded MQTT broker on 1883.
# - Mailpit is a local SMTP capture server: when SMTP_RELAY=mailpit (default in
#   this compose file), transactional emails land at http://localhost:8025
#   instead of being sent.
#
# Copy .env.example to .env and fill in SECRET_KEY_BASE before bringing this up
# in anything resembling production:
#
#     cp .env.example .env
#     docker compose up -d --build
#
# In a real deployment the app container would additionally join an existing
# Traefik network (TLS termination) — see the project plan. Locally, HTTP is
# served directly because prod.exs force_ssl excludes the "localhost" host.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dtu_app_prod}
    # Internal-only: no host port mapping. The `app` container reaches the
    # DB over the compose network as `db:5432`, so binding to the host's
    # 5432 is unnecessary — and was actively inconvenient when sibling
    # stacks (e.g. comics-postgres-1) also wanted 5432. To inspect the DB
    # from the host, exec in: `docker compose exec db psql ...` (or
    # `docker compose run --service-ports db` for one-off port publishing).
    expose:
      - "5432"
    volumes:
      - dtu_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dtu_app_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Local SMTP capture server. The compose file defaults SMTP_RELAY=mailpit so
    # the app routes transactional email here out of the box. Open
    # http://localhost:8025 to inspect the magic-link / confirmation emails.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    volumes:
      - dtu_app_mailpit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1025 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "4000:4000"   # Phoenix HTTP / LiveView
      - "1883:1883"   # embedded MQTT broker (plain TCP; DTUs connect here)
    # `wget --spider` does an HTTP HEAD-like probe: it issues a GET
    # but discards the body, returning 0 only on 2xx. That maps to
    # Docker's healthcheck contract (0 = healthy, non-zero = unhealthy)
    # so a 200 from `/healthz` flips the container to `healthy`, and
    # a 503 (DB or broker down) flips it to `unhealthy` — which the
    # `restart: unless-stopped` policy above then turns into a restart
    # loop until things recover. The endpoint's full JSON body is
    # visible via `docker compose inspect` or `docker logs`; we don't
    # need to scrape it from here.
    #
    # Intervals: 10 s probe cadence, 5 s timeout, 5 retries before
    # declaring `starting` → `unhealthy`. At 10 s the steady-state
    # probe cost is one `SELECT 1` per `app` container every 10 s,
    # which is negligible vs. the query load the app itself puts on
    # the DB. `--spider` is silent on success (no body written), so
    # `/app` stays clean of probe artifacts.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q -T 5 http://localhost:4000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      # How the site is reached publicly — drives URL generation in emails.
      # This compose stack serves plain HTTP on :4000 (no TLS); set
      # PHX_SCHEME=https + PHX_PORT=443 when fronted by a TLS terminator.
      PHX_SCHEME: ${PHX_SCHEME:-http}
      PHX_PORT: ${PHX_PORT:-4000}
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dtu_app_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set — copy .env.example to .env}
      POOL_SIZE: ${POOL_SIZE:-15}
      # The release image doesn't ship git (see .dockerignore), so the runtime
      # git branch lookup is unavailable. Stamp a friendly identifier here so
      # the version footer renders "dev" in local compose instead of falling
      # back to the package version.
      RELEASE_VERSION: ${RELEASE_VERSION:-dev}
      # MQTT broker listens on 1883 inside the container; remap the host side
      # via the ports mapping above. Set MQTT_BROKER_ENABLED=false to disable.
      MQTT_BROKER_ENABLED: ${MQTT_BROKER_ENABLED:-true}
      MQTT_BROKER_PORT: "1883"
      # DNS alias for the MQTT endpoint, shown as the broker host in the device
      # setup modal. Empty = use PHX_HOST (broker and web app on the same host).
      MQTT_HOST: ${MQTT_HOST:-}
      # Transactional email — standard SMTP. The defaults below route to the
      # mailpit sidecar on the compose network (no auth, no TLS). For prod,
      # override SMTP_RELAY (and SMTP_USERNAME/SMTP_PASSWORD/SMTP_TLS as
      # required) to point at a real relay. See .env.example for the full
      # contract and per-relay examples (SES / Mailgun / Postmark).
      SMTP_RELAY: ${SMTP_RELAY:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-localhost}
      SMTP_TLS: ${SMTP_TLS:-never}
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE:-never}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-DtuApp <noreply@localhost>}
      # Web Push (VAPID, RFC 8292). The runtime refuses to start in :prod
      # without these — see config/runtime.exs. Generate with `bin/gen-vapid`
      # and paste the three values into .env. The private_key signs every
      # native push; rotating it invalidates every browser PushManager
      # subscription for this origin (use --force with `bin/gen-vapid`).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY must be set — run bin/gen-vapid and paste into .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY must be set — run bin/gen-vapid and paste into .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}

volumes:
  dtu_app_pgdata:
  dtu_app_mailpit_data:
