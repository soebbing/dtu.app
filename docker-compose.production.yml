# Production example. Pulls the release image from GHCR; everything else
# (build, deploy, update) is the same as docker-compose.yml — see that file
# for the dev workflow.
#
# Behind a TLS terminator (Traefik, Caddy, nginx, cloud LB). This file does
# NOT bind the Phoenix port to the host; the reverse proxy reaches the
# app container on the internal network. If your DTUs connect directly to
# this host, also uncomment the ports block on the `app` service to expose
# the MQTT broker (1883).
services:
  app:
    image: ghcr.io/soebbing/dtu-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    # IMAGE_TAG defaults to the moving :latest. Set it to a calver tag in
    # .env (e.g. v2026-07-26-1) to pin a specific release.
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:?PHX_HOST must be set}
      PORT: "4000"
      PHX_SCHEME: ${PHX_SCHEME:-https}
      PHX_PORT: ${PHX_PORT:-443}
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-dtu_app_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set — copy .env.example to .env}
      POOL_SIZE: ${POOL_SIZE:-15}
      MQTT_BROKER_ENABLED: ${MQTT_BROKER_ENABLED:-true}
      MQTT_BROKER_PORT: "1883"
      # Shown to users as the broker host in the device setup modal. Empty
      # = use PHX_HOST (broker and web app share the same hostname).
      MQTT_HOST: ${MQTT_HOST:-}
      # Empty RESEND_API_KEY falls back to the in-memory mailer — magic-link
      # login then doesn't work.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-DtuApp <noreply@localhost>}
    # ports:
    #   - "1883:1883"   # uncomment for direct host access to the MQTT broker
    networks:
      - internal

  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-dtu_app_prod}
    volumes:
      - dtu_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dtu_app_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  dtu_app_pgdata: