# Production example. Pulls the release image from GHCR; everything else
# (build, deploy, update) is the same as docker-compose.yml — see that file
# for the dev workflow.
#
# Behind a TLS terminator (Traefik, Caddy, nginx, cloud LB). This file does
# NOT bind the Phoenix port to the host; the reverse proxy reaches the
# app container on the internal network. If your DTUs connect directly to
# this host, also uncomment the ports block on the `app` service to expose
# the MQTT broker (1883).
#
# MQTTS: the app container also has Traefik labels below that route a TCP
# MQTT entrypoint on :8883 into the broker's plain :1883. Configure a
# matching entrypoint + TLS router + service in your Traefik static config
# (let's-encrypt, a static cert, or whatever you already use for HTTPS):
#
#     entryPoints:
#       mqtts:
#         address: ":8883"
#
#     tcp:
#       routers:
#         mqtt-tls:
#           entrypoints: [mqtts]
#           rule: "HostSNI(`*`)"   # tighten to e.g. `mqtt.example.com` for per-host cert
#           tls: {}
#           service: mqtt
#       services:
#         mqtt:
#           loadbalancer:
#             servers:
#               - address: "app:1883"
#
# The `traefik` network below must exist (create it with `docker network
# create traefik` or let your Traefik compose file create it). When
# MQTTS_HOST is set in .env, the device setup modal shows BOTH the TLS
# endpoint (recommended) and the plain MQTT fallback so DTUs that don't
# support TLS can still connect.
services:
  app:
    image: ghcr.io/soebbing/dtu-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    # IMAGE_TAG defaults to the moving :latest. Set it to a calver tag in
    # .env (e.g. v2026-07-26-1) to pin a specific release.
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:?PHX_HOST must be set}
      PORT: "4000"
      PHX_SCHEME: ${PHX_SCHEME:-https}
      PHX_PORT: ${PHX_PORT:-443}
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-dtu_app_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set — copy .env.example to .env}
      POOL_SIZE: ${POOL_SIZE:-15}
      MQTT_BROKER_ENABLED: ${MQTT_BROKER_ENABLED:-true}
      MQTT_BROKER_PORT: "1883"
      # Shown to users as the broker host in the device setup modal. Empty
      # = use PHX_HOST (broker and web app share the same hostname).
      MQTT_HOST: ${MQTT_HOST:-}
      # Set MQTTS_HOST to the DNS name DTUs connect to over TLS (e.g.
      # mqtt.example.com). When set, the device setup modal shows both
      # mqtts://MQTTS_HOST:MQTTS_PORT (recommended) and the plain
      # mqtt://MQTT_HOST:1883 fallback. The broker itself stays plain TCP
      # on 1883 inside the container; Traefik terminates TLS.
      MQTTS_HOST: ${MQTTS_HOST:-}
      MQTTS_PORT: ${MQTTS_PORT:-8883}
      # Empty RESEND_API_KEY falls back to the in-memory mailer — magic-link
      # login then doesn't work.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-DtuApp <noreply@localhost>}
    # ports:
    #   - "1883:1883"   # uncomment for direct host access to the MQTT broker
    labels:
      - "traefik.enable=true"
      # Plain HTTP / HTTPS is terminated by Traefik too; these routers are
      # for completeness — drop them if your Traefik routes the web app
      # from a different stack.
      - "traefik.http.routers.dtu-app.rule=Host(`${PHX_HOST}`)"
      - "traefik.http.routers.dtu-app.entrypoints=websecure"
      - "traefik.http.routers.dtu-app.tls=true"
      - "traefik.http.services.dtu-app.loadbalancer.server.port=4000"
      # MQTTS TCP router (port 8883, terminated by Traefik).
      - "traefik.tcp.routers.dtu-mqtt.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.dtu-mqtt.entrypoints=mqtts"
      - "traefik.tcp.routers.dtu-mqtt.tls=true"
      - "traefik.tcp.services.dtu-mqtt.loadbalancer.server.port=1883"
    networks:
      - internal
      - traefik

  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-dtu_app_prod}
    volumes:
      - dtu_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dtu_app_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  internal:
    driver: bridge
  traefik:
    # Must already exist — `docker network create traefik` (or have your
    # Traefik compose file create it). External so the same network can be
    # shared between this stack and the Traefik container.
    external: true

volumes:
  dtu_app_pgdata: