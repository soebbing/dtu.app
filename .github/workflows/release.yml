name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify mix.exs version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag="${tag#v}"
          version=$(grep -E '^\s*version:' mix.exs | head -1 | sed -E 's/.*version: *"([^"]+)".*/\1/')
          if [ "$tag" != "$version" ]; then
            echo "::error::mix.exs version ($version) does not match tag ($tag)"
            echo "Bump the version in mix.exs to '$tag' before tagging the release."
            exit 1
          fi
          echo "mix.exs version $version matches tag $tag."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dtu-app
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker images

            ```
            ghcr.io/${{ github.repository_owner }}/dtu-app:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/dtu-app:latest
            ```