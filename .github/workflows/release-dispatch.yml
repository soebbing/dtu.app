name: Create release

# Manual "release with a click of a button" workflow.
#
# How to use:
#   1. GitHub → Actions → "Create release" → Run workflow
#   2. Fill in the calver version (e.g. `2026-07-26-2`)
#   3. Workflow validates the format, refuses to run if the tag already
#      exists on the remote, then creates + pushes the tag
#   4. The tag push triggers .github/workflows/release.yml (the existing
#      tag-triggered builder), which builds the Docker image, pushes it to
#      GHCR, and creates the GitHub Release with auto-generated notes
#      (from merged PRs since the previous tag)
#
# The existing tag-push path (manually running
#   git tag 2026-07-26-2 && git push origin 2026-07-26-2
# ) still works for maintainers who prefer the CLI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Calver tag for the release, e.g. `2026-07-26-2`. Must match
          YYYY-MM-DD-N where N is a non-negative integer.
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: Create and push tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag creation must happen on the default branch; this protects
          # against accidentally tagging from a feature branch.
          ref: main
          # Use a PAT / GitHub App token (not the default GITHUB_TOKEN) so the
          # downstream `push: tags` event can trigger release.yml. Events
          # triggered by the workflow's own GITHUB_TOKEN are intentionally
          # suppressed by GitHub to prevent runaway recursion.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Calver: YYYY-MM-DD-N where N is a non-negative integer.
          # We also accept the optional leading "v" some projects use.
          if ! [[ "$VERSION" =~ ^v?[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not a valid calver tag."
            echo "Expected format: YYYY-MM-DD-N (e.g. 2026-07-26-2), optionally prefixed with 'v'."
            exit 1
          fi

      - name: Refuse if tag already exists on the remote
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          # Strip an optional leading "v" before checking, since git tags
          # are typically stored without it but the user might type it.
          TAG="${TAG#v}"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::tag '${TAG}' already exists on the remote — refusing to overwrite."
            echo "If you want a new release, bump the trailing counter (e.g. ...-${TAG#${TAG%?}})."
            exit 1
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          # Drop a leading "v" if the user typed it — `git tag` / `gh release`
          # both handle the raw calver form, and the workflow that consumes
          # the tag (release.yml) gets a clean ref_name either way.
          TAG="${TAG#v}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Rewrite the origin URL to authenticate with the PAT so the
          # resulting push is NOT attributed to GITHUB_TOKEN. Only non-
          # GITHUB_TOKEN pushes are allowed to trigger downstream
          # workflows (i.e. release.yml).
          git remote set-url origin \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"

          git tag "$TAG"
          git push origin "$TAG"

          echo "::notice::Created and pushed tag ${TAG}. The .github/workflows/release.yml job will now run to build and publish the image."
