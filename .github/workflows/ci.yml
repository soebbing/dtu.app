name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    outputs:
      should-build-docker: ${{ steps.test-result.outputs.success }}

    # VAPID placeholder values so `config/runtime.exs` (which refuses
    # to start in `:prod` without VAPID keys) doesn't blow up on the
    # prod-environment CI steps. These never reach the browser — the
    # E2E suite doesn't exercise Web Push, and `DtuApp.Push.deliver/2`
    # short-circuits when VAPID is set but not real. We use distinct
    # fixed strings rather than runtime-generated keys so the
    # `MIX_ENV=prod` startup is reproducible across CI runs.
    #
    # Both placeholders are valid URL-safe-base64 P-256 key material:
    # 87 chars public (= ceil(65 * 4 / 3), uncompressed-point), 43 chars
    # private (= ceil(32 * 4 / 3), scalar). Anything else would trip the
    # `atob("String contains an invalid character")` check in
    # `assets/js/push_subscribe.js` if a browser ever tried to subscribe.
    env:
      VAPID_PUBLIC_KEY: "BJTUEpHLN69OMVAoFchd_RCm7kzXYyiGLhj-yHFwp0dCHciZUh6XRChhfY6R0cEm4CZ5whrZPaNszMPlWkBMuy0"
      VAPID_PRIVATE_KEY: "xE0IOv4yhbso6voJbQkZj2X9kEr8zsh9yTZouFU9cYc"
      VAPID_SUBJECT: "mailto:ci@localhost"

    services:
      db:
        # Pinned to a specific tag instead of `latest-pg16` to keep CI runs
        # reproducible — `latest` is a moving target and an image bump on the
        # runner host can introduce transient flakes (e.g. longer first-boot
        # init times after a TimescaleDB major upgrade).
        image: timescale/timescaledb:2.29.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        # Local SMTP capture for the E2E magic-link test. Phoenix connects
        # to SMTP_RELAY=localhost:1025 (port published to host), the E2E
        # test hits Mailpit's JSON API at http://localhost:8025 to pull the
        # magic-link URL out of the captured message.
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Elixir & Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.16.2'
          otp-version: '26.2.2'

      - name: Cache Elixir Dependencies & Build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Check Code Formatting
        run: mix format --check-formatted

      - name: Compile Application (Warnings as Errors)
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Run ExUnit Tests
        run: mix test
        env:
          MIX_ENV: test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Install Playwright Chromium with System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Compile Production Assets
        run: mix assets.deploy
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/dtu_app_prod
          SECRET_KEY_BASE: dummy_secret_key_base_at_least_64_bytes_long_for_production_server
          MQTT_BROKER_ENABLED: "false"
          PHX_HOST: localhost
          PHX_SCHEME: http
          PHX_PORT: "4000"
          # Use the Mailpit sidecar so the magic-link E2E test can read the
          # captured email from Mailpit's JSON API at :8025.
          MAIL_DELIVERY: mailpit
          SMTP_RELAY: localhost
          SMTP_PORT: "1025"

      - name: Setup & Seed E2E Database
        run: |
          mix ecto.create
          mix ecto.migrate
          mix run priv/repo/seeds.exs
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/dtu_app_prod
          SECRET_KEY_BASE: dummy_secret_key_base_at_least_64_bytes_long_for_production_server
          MQTT_BROKER_ENABLED: "false"
          PHX_HOST: localhost
          PHX_SCHEME: http
          PHX_PORT: "4000"
          MAIL_DELIVERY: mailpit
          SMTP_RELAY: localhost
          SMTP_PORT: "1025"

      - name: Start Phoenix Server
        run: |
          PORT=4000 mix phx.server > phx.log 2>&1 &
        env:
          MIX_ENV: prod
          PHX_SERVER: "true"
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/dtu_app_prod
          SECRET_KEY_BASE: dummy_secret_key_base_at_least_64_bytes_long_for_production_server
          MQTT_BROKER_ENABLED: "false"
          PHX_HOST: localhost
          PHX_SCHEME: http
          PHX_PORT: "4000"
          MAIL_DELIVERY: mailpit
          SMTP_RELAY: localhost
          SMTP_PORT: "1025"
          # Flip the passkey kill switch on for the E2E suite. `:prod` defaults
          # to OFF for the 24h monitor window after launch (see
          # `DtuAppWeb.Passkeys.KillSwitch`); the e2e tests need the card to
          # render, so override explicitly. Safe — CI does not ship.
          PASSKEYS_ENABLED: "true"
          # Pin `rp.id` to `localhost`. The server runs in MIX_ENV=prod, where
          # the env-aware default for `WEBAUTHN_RP_ID` is "dtu.app" (see
          # `DtuAppWeb.Passkeys.RpId.default/1`). But the e2e origin is
          # `http://localhost:4000`, and the WebAuthn spec requires `rp.id` to
          # be a registrable-domain suffix of the origin's effective domain —
          # `localhost` is NOT a suffix of `dtu.app`, so the browser throws
          # `SecurityError` from `navigator.credentials.create()`. Setting
          # `WEBAUTHN_RP_ID=localhost` matches the test origin and unblocks
          # `passkey_login.spec.js`. Safe — CI does not ship.
          WEBAUTHN_RP_ID: "localhost"
          # Disable the passkey rate limiter for the e2e suite. The server
          # runs in MIX_ENV=prod, which enables `DtuAppWeb.Plugs.PasskeyRateLimit`
          # at 10 hits / 60 s / (IP, action). Under Playwright's `retries: 2`
          # (= 3 attempts per serial block), the cumulative `authentication_options`
          # hits per CI run can exceed the budget, and a single
          # `passkey_login.spec.js` failure surfaces as
          # `Passkey error: too_many_attempts`. The unit test
          # `passkey_rate_limit_test.exs` already pins the plug's logic, so
          # disabling it in CI doesn't lose coverage. Safe — CI does not ship.
          PASSKEYS_RATE_LIMIT_ENABLED: "false"

      - name: Wait for Phoenix Server
        run: |
          timeout 60s bash -c 'until curl -s http://localhost:4000 > /dev/null; do sleep 1; done'

      - name: Print Phoenix Server Startup Log on Wait Timeout
        if: failure()
        run: cat phx.log || true

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Print Phoenix Server Logs on Failure
        if: failure()
        run: cat phx.log || true

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Set test result output
        id: test-result
        if: always()
        run: echo "success=${{ job.status == 'success' && 'true' || 'false' }}" >> $GITHUB_OUTPUT

  build-docker:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.should-build-docker == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dtu.app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/dtu_app_image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/dtu_app_image.tar
          retention-days: 7
